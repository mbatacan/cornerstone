repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--unsafe]  # mkdocs.yml uses !!python/name tags
      - id: end-of-file-fixer
      - id: trailing-whitespace
  # ruff and ty run through uv so their versions come from uv.lock, not a second pin.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ty
        name: ty
        entry: uv run ty check src/
        language: system
        pass_filenames: false
        files: ^(src/|pyproject\.toml|uv\.lock)
