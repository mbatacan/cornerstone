# configs/prod.yaml — Databricks production workspace.
# Activated when CORNERSTONE_ENV=prod.
# Secrets are injected via env vars (CORNERSTONE_DATABRICKS_TOKEN, etc.)
# or via Databricks secret scope in the job cluster init.

mlflow:
  tracking_uri: "databricks"
  experiment_name: "/Shared/ds-template/prod/experiments"
  registered_model_name: "ds-template-model"

alerts:
  table_path: "dbfs:/mnt/prod/alerts"
  default_threshold: 0.5
  default_severity: "warn"
