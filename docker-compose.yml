version: "3.9"

services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    volumes:
      - .:/app          # mount repo so edits in the container persist
      - mlruns:/app/mlruns
    environment:
      - CORNERSTONE_ENV=dev
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow

  mlflow:
    image: python:3.11-slim
    command: >
      bash -c "pip install --quiet mlflow &&
               mlflow server
               --host 0.0.0.0
               --port 5000
               --backend-store-uri /mlruns
               --default-artifact-root /mlruns"
    ports:
      - "5000:5000"
    volumes:
      - mlruns:/mlruns

volumes:
  mlruns:
