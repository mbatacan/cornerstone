[project]
name = "ds-template"
version = "0.1.0"
description = "A template for data science projects"
authors = [{name = "Matt Batacan", email = "mattbatacan@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "joblib",
    "jupyterlab",
    "lightgbm",
    "matplotlib",
    "mlflow",
    "notebook",
    "numpy",
    "pandas",
    "plotly",
    "pydantic",
    "scikit-learn",
    "scipy",
    "seaborn",
    "sqlalchemy",
    "statsmodels",
    "xgboost",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src",
]

[dependency-groups]
dev = [
    "bandit",
    "black",
    "flake8",
    "ipykernel",
    "isort",
    "mkdocs",
    "mkdocs-autorefs",
    "mkdocs-git-revision-date-plugin",
    "mkdocs-material",
    "mypy",
    "pre-commit",
    "pymdown-extensions",
    "pytest",
    "pytest-cov",
    "ruff",
    "types-PyYAML",
]

[tool.black]
exclude = "^tests/"
line-length = 88
skip-string-normalization = true
[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
line-length = 88
target-version = "py39"
[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
line_length = 88
