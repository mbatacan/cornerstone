[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ds-template"
version = "0.1.0"
description = "Boeing alerting & prognostics DS/MLE project template"
authors = [{ name = "Matt Batacan", email = "mattbatacan@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "scipy",
    "jupyterlab",
    "notebook",
    "statsmodels",
    "xgboost",
    "lightgbm",
    "joblib",
    "plotly",
    "mlflow",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy",
    "pyyaml",
    "typer",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pylint",
    "black",
    "mypy",
    "pre-commit",
    "ipykernel",
    "mkdocs",
    "mkdocs-material",
    "mkdocs-git-revision-date-plugin",
    "pymdown-extensions",
    "mkdocs-autorefs",
    "types-PyYAML",
    "pip-tools",
]

[project.scripts]
ds-template = "src.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
skip-string-normalization = true
exclude = "^tests/"

[tool.pylint.main]
ignore = [".venv", "build", "dist"]

[tool.pylint.format]
max-line-length = 88

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-function-docstring",
    "missing-class-docstring",
    "too-few-public-methods",
    "import-error",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
line_length = 88
