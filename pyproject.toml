[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ds-template"
version = "0.1.0"
description = "Personal DS/ML project template"
authors = [{ name = "Matt Batacan", email = "mattbatacan@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "scipy",
    "statsmodels",
    "xgboost",
    "lightgbm",
    "joblib",
    "plotly",
    "mlflow",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy",
    "pyyaml",
    "typer",
    "python-dotenv",
]

[project.optional-dependencies]
serve = ["fastapi", "uvicorn[standard]"]

[project.scripts]
ds-template = "src.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # ruff format handles code; long docstring lines are fine

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "ty",
    "pre-commit",
    "httpx",
    "ipykernel",
    "jupyterlab",
    "mkdocs",
    "mkdocs-material",
    "mkdocs-git-revision-date-plugin",
    "pymdown-extensions",
    "mkdocs-autorefs",
]
