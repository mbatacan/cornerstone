# src/configs/default.yaml — base config, applies to all environments (local defaults).
# Override any value in local.yaml, dev.yaml, staging.yaml, or prod.yaml.
# Environment variables with prefix CORNERSTONE_ take precedence over all YAML values.
# Shipped inside the wheel, so Databricks jobs read the same files.

project_name: "ds-template"

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "ds-template-local"
  registered_model_name: "ds-template-model"
  model_alias: "champion"

predictions:
  output_path: "output/predictions"

data:
  raw_path: "data/raw"
  processed_path: "data/processed"

training:
  random_seed: 42
  test_size: 0.2
  n_estimators: 100
